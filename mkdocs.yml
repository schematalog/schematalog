site_name: Schematalog
site_description: A registry/catalog for JSON Schema specifications.
site_author: Berislav Lopac <berislav@lopac.net>
repo_url: https://github.com/berislavlopac/schematalog
site_url: https://schematalog.com
use_directory_urls: false

validation:
  omitted_files: warn
  absolute_links: relative_to_docs
  unrecognized_links: warn
  anchors: warn

theme:
  name: materialx
  icon:
    logo: material/database-search
  features:
    - navigation.instant
    # Lets a section's `index.md` be the section itself, so clicking the heading goes
    # somewhere instead of only toggling it open.
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - search.suggest
  palette:
    # Automatic mode: follow the system colour scheme
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

# Sorted by who is reading, not by what kind of page it is: the reference pages sit
# inside the section whose reader needs them, so an operator is never sent hunting in
# a sibling tree for half their material. Each section leads with an index page that
# says who it is for and in what order to read it - the one thing the sidebar cannot.
nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Running an instance:
    - operating/index.md
    - operating/configuration.md
    - operating/storage.md
    - operating/writing-a-backend.md
  - Using the API:
    - api/index.md
    - api/publishing.md
    - api/retrieving.md
    - api/lifecycle.md
    - api/reference.md
  - Using the web UI:
    - webui/index.md
    - webui/formats.md
