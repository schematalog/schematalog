# fly.toml app configuration file generated for schematalog on 2023-04-27T08:46:13+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "schematalog"
primary_region = "lhr"
kill_signal = "SIGINT"
kill_timeout = "5s"

[experimental]
  auto_rollback = true

[env]
  PRIMARY_REGION = "lhr"
  SCHEMATALOG_ENVIRONMENT = "production"
  SCHEMATALOG_PLATFORM = "fly"

# A leftover from the pre-Postgres filesystem store, kept rather than destroyed. The
# application does not use it - storage is configured by SCHEMATALOG_STORAGE_URL - but the
# machine has it attached, and a config that does not mention it makes every deploy stop
# to ask about the mismatch.
[[mounts]]
  source = "schematalog_storage_machines"
  destination = "/storage"
  processes = ["app"]

[[services]]
  protocol = "tcp"
  internal_port = 8000
  processes = ["app"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]
  [services.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    restart_limit = 0

  # https://community.fly.io/t/edge-headers/9278
  [services.ports.http_options.response.headers]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "*"
    Access-Control-Allow-Headers = "*"