[project]
name = "schematalog-workspace"
version = "0"
description = "Development workspace for the Schematalog packages."
requires-python = "~=3.14.0"
# The root is not a distribution. It exists to hold the workspace, the tooling
# configuration shared by every package, and the environment `just` runs against.
dependencies = [
    "schematalog-app",
    "schematalog-core",
    "schematalog-s3",
]

[dependency-groups]
dev = [
    "deptry>=0.23.0",
    "pip>=25.1.1",
    "pyrefly>=1.0.0",
    "ruff>=0.11.12",
]
tests = [
    "pytest>=8.1.1",
    "pytest-cov>=5.0.0",
    "pytest-spec>=3.2.0",
    "pytest-asyncio>=0.23.6",
    # Both of these arrived transitively through schemathesis until it was removed, and
    # both are needed directly: hypothesis is imported by the property tests, and httpx
    # is what `starlette.testclient` runs on, so without it the entire suite fails to
    # collect. Declaring them is the point - while they were implicit, removing an
    # unrelated package took them out with it. deptry cannot catch this class of thing
    # here, because it excludes `tests/` by default and that is the only place they are
    # used.
    "hypothesis>=6.153",
    "httpx>=0.27",
    "aiosqlite>=0.20.0",
    "moto>=5.2.3",
]
# mkdocs-materialx is the maintained drop-in fork of mkdocs-material (theme name
# `materialx`); upstream material pivoted to Zensical. Build-time only, never imported.
docs = [
    "mkdocs-materialx>=10.1.7",
]

[tool.uv]
package = false
default-groups = "all"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
schematalog-app = { workspace = true, editable = true }
schematalog-core = { workspace = true, editable = true }
schematalog-s3 = { workspace = true, editable = true }

[tool.pytest.ini_options]
minversion = "6.0"
# Several distributions each carry a `tests/` package, and every test directory keeps its
# `__init__.py` per the project convention - which under the default import mode makes two
# importable `tests` packages and a collision. `importlib` mode names each test module
# from its path instead, so packages can be tested where they live without dropping the
# convention.
addopts = "--import-mode=importlib"
# `importlib` mode does not put the rootdir on sys.path, and the suite imports
# `scripts.seed` and its own helpers by package name.
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning"
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
# The namespace spans three distributions, so measure the package rather than a
# directory: `source_pkgs` follows the installed `schematalog.*` modules wherever
# their files live.
source_pkgs = ["schematalog"]
omit = ["*/tests/*", ]

[tool.coverage.report]
skip_covered = false
show_missing = true
fail_under = 90
exclude_also = ["pragma: no cover", "@abstract",]

[tool.pyrefly]
# Autogenerated/test code is excluded from type analysis (mirrors ruff/deptry).
project-excludes = [
    "**/tests/**",
    "**/.venv/**",
]

[tool.ruff]
line-length = 96
output-format = "grouped"
# Where first-party packages live, so ruff can resolve a module's dotted path (used by
# `allowed-markup-calls` below) and sort imports correctly across the workspace.
# Package roots first: the resolver takes the first match, and `.` would otherwise
# resolve this file as `packages.schematalog-app.schematalog.app...`.
src = [
    "packages/schematalog-app",
    "packages/schematalog-core",
    "packages/schematalog-s3",
    ".",
]
[tool.ruff.lint]
select = [  # see https://docs.astral.sh/ruff/rules/
    "E4", "E7", "E9",  # basic pycodestyle rules
    "W",        # pycodestyle warnings
    "F",        # Pyflakes rules
    "W",        # pycodestyle warnings
    "C90",      # McCabe complexity
    "N",        # PEP8 naming conventions
    "I",        # import statements linting and formatting
    "PLR",      # Pylint refactoring recommendations
    "PTH",      # recommends to use pathlib instead of os.path
    "UP",       # pyupgrade suggestions
    "BLE",      # locates blind exception capture
    "B",        # locates possible bugs and design problems
    "A",        # locates shadowing of builtin names
    "C4",       # locates possible issues with comprehensions
    "DTZ",      # locates incorrect use of timezone information
    "PIE",      # miscellaneous linting rules
    "TRY",      # locates potential exception handling antipatterns
    "PERF",     # locates potential performance issues
    "RUF",      # various Ruff-specific linting rules
    "S",        # various insecure code, with bandit
    "ERA",      # eradicate: commented-out code
]
external = [
    "F841",     # vulture uses this code for ignoring unused names
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "F401",     # allow unused imports
    "F403",     # allow `import *`
]
# The conformance suite is test code that ships, so it lives under the same exemptions
# as tests/ - asserts are its entire vocabulary.
"packages/schematalog-core/schematalog/testing/*" = [
    "S101",     # allow asserts
]
# Every test tree, wherever its package lives.
"**/tests/*" = [
    "PLR0913",  # unlimited function arguments
    "S101",     # allow asserts
    "S105",     # allow harcoded passwords
    "N802",     # allow variable case in test names
    "PLR2004",  # allow magic values in comparisons
    "S311",     # allow random generator
    "TRY003",   # a test double raises a realistic message; that is the point of it
]
"packages/schematalog-core/schematalog/common/avroform/*" = [
    "TRY003",   # contextual messages on conversion errors are intentional
    "PLR0911",  # the Avro/JSON Schema dispatch naturally has many branches
]

[tool.ruff.lint.isort]
# see https://docs.astral.sh/ruff/settings/#lintisort
# Was `email_ingestion`, copied from another project and wrong ever since.
known-first-party = ["schematalog"]
force-sort-within-sections = true

[tool.ruff.lint.pylint]
max-args = 6

[tool.ruff.lint.flake8-bugbear]
# FastAPI relies on function calls (Depends, etc.) in argument defaults.
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.format]
# see https://docs.astral.sh/ruff/settings/#format

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false
